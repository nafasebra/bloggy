# Standalone CI database; intentionally independent of the root .env and stack.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bloggy_ci
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: bloggy_ci
    ports:
      - "127.0.0.1:${CI_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloggy_ci -d bloggy_ci"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
