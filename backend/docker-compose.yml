services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloggy}
      POSTGRES_DB: ${POSTGRES_DB:-bloggy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloggy}:${POSTGRES_PASSWORD:-bloggy}@postgres:5432/${POSTGRES_DB:-bloggy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in backend/.env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      - backend-uploads:/app/uploads

volumes:
  postgres-data:
  backend-uploads:
