services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DATABASE_URI: mongodb://mongodb:27017/bloggy
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "3030:3030"
    volumes:
      - backend-uploads:/app/uploads

  web:
    build:
      context: ./frontend
      target: web
      args:
        APP: web
        API_URL: http://backend:3030
        JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3030
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./frontend
      target: dashboard
      args:
        APP: dashboard
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  mongodb-data:
  backend-uploads:
