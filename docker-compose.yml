services:
  postgres:
    container_name: bloggy-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloggy}
      POSTGRES_DB: ${POSTGRES_DB:-bloggy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloggy}:${POSTGRES_PASSWORD:-bloggy}@postgres:5432/${POSTGRES_DB:-bloggy}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env or use --env-file}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      - backend-uploads:/app/uploads

  web:
    build:
      context: ./frontend
      target: web
      args:
        APP: ${WEB_APP:-web}
        API_URL: ${API_URL:?Set API_URL in the root .env or use --env-file}
        JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env or use --env-file}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in the root .env or use --env-file}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:?Set NEXT_PUBLIC_DASHBOARD_URL in the root .env or use --env-file}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: ${API_URL:?Set API_URL in the root .env or use --env-file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env or use --env-file}
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./frontend
      target: dashboard
      args:
        APP: ${DASHBOARD_APP:-dashboard}
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in the root .env or use --env-file}
        VITE_WEB_URL: ${VITE_WEB_URL:?Set VITE_WEB_URL in the root .env or use --env-file}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  postgres-data:
  backend-uploads:
