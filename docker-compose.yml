services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloggy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloggy}
      POSTGRES_DB: bloggy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3030
      DATABASE_URL: postgresql://${POSTGRES_USER:-bloggy}:${POSTGRES_PASSWORD:-bloggy}@postgres:5432/bloggy
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
    ports:
      - "3030:3030"
    volumes:
      - backend-uploads:/app/uploads

  web:
    build:
      context: ./frontend
      target: web
      args:
        APP: web
        API_URL: http://backend:3030
        JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:3030
    ports:
      - "3000:3000"

  dashboard:
    build:
      context: ./frontend
      target: dashboard
      args:
        APP: dashboard
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3030}
        VITE_WEB_URL: ${VITE_WEB_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3001:80"

volumes:
  postgres-data:
  backend-uploads:
